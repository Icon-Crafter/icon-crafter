[package]
name = "dp-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional AI subsystem: provider abstraction, prompt templates, validated document-operation proposals, undoable transactions"

[features]
http = ["dep:reqwest"]

[dependencies]
dp-model = { path = "../dp-model" }
dp-geom = { path = "../dp-geom" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
