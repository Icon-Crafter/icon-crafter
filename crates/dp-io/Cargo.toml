[package]
name = "dp-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Import/export: SVG import and export, PNG/JPEG raster export, PDF export, asset extraction, HTML/CSS export"

[dependencies]
dp-model = { path = "../dp-model" }
dp-geom = { path = "../dp-geom" }
dp-render = { path = "../dp-render", default-features = false }
dp-text = { path = "../dp-text" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.12.0"
tiny-skia-path = "0.12.0"
usvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
svg2pdf = "0.13.0"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
dp-model = { path = "../dp-model" }
dp-geom = { path = "../dp-geom" }
