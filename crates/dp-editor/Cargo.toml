[package]
name = "dp-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Editor state machine: tools, selection, hit testing, drag math, snapping, commands, overlays and export used by the desktop app and tests"

[dependencies]
dp-model = { path = "../dp-model" }
dp-geom = { path = "../dp-geom" }
dp-layout = { path = "../dp-layout" }
dp-render = { path = "../dp-render", default-features = false }
dp-text = { path = "../dp-text" }
dp-io = { path = "../dp-io" }
dp-persist = { path = "../dp-persist" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
tempfile = "3.14.0"
