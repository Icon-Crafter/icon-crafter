[package]
name = "iconcrafter-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Icon Crafter collaboration and publishing server (Axum + PostgreSQL + S3-compatible storage)"

[features]
default = []
s3 = ["dep:aws-sdk-s3"]
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
    "cors",
    "trace",
    "limit",
    "fs",
    "compression-gzip",
    "request-id",
    "timeout",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
    "macros",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
indexmap = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.6.0"
sha2 = "0.11.1"
base64 = "0.23.1"
subtle = "2.6.1"
hex = "0.4.3"
futures = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
getrandom = "0.4"
url = "2.5.8"
dp-model = { path = "../../crates/dp-model" }
dp-collab = { path = "../../crates/dp-collab" }
aws-sdk-s3 = { version = "1.155.0", optional = true }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }

[dev-dependencies]
tempfile = "3.14.0"
