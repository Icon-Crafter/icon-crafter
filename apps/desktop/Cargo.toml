[package]
name = "iconcrafter-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Icon Crafter desktop application shell and IPC command layer (Tauri 2)"

[lib]
name = "iconcrafter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
arboard = "3.7.0"
dp-model = { path = "../../crates/dp-model" }
dp-geom = { path = "../../crates/dp-geom" }
dp-layout = { path = "../../crates/dp-layout" }
dp-text = { path = "../../crates/dp-text" }
dp-render = { path = "../../crates/dp-render" }
dp-io = { path = "../../crates/dp-io" }
dp-persist = { path = "../../crates/dp-persist" }
dp-collab = { path = "../../crates/dp-collab" }
dp-prototype = { path = "../../crates/dp-prototype" }
dp-devmode = { path = "../../crates/dp-devmode" }
dp-plugins = { path = "../../crates/dp-plugins" }
dp-ai = { path = "../../crates/dp-ai" }
