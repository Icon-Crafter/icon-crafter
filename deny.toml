[advisories]
# Fail the build on vulnerabilities, but surface warnings for anything that is
# not yet actionable so they are visible without blocking unrelated work.
yanked = "deny"
unmaintained = "warn"
unsound = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Never ship a second TLS stack, an insecure crate or an experimental
    # parallel executor in the desktop app.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rand-old" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
