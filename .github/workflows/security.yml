# Security and repository hygiene.
#
#   * secrets        -> gitleaks over the full history (fails the PR)
#   * dependency audit -> cargo-audit against the lockfile (high/critical)
#   * supply chain   -> cargo-deny: licenses, sources, advisories, bans
#   * repo hygiene   -> no committed build output, secrets or oversized files
#
# These run on PRs, on main and on a weekly schedule so advisories are picked
# up even when nobody pushes.
name: Security

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "apps/ui/package.json"
      - "apps/ui/pnpm-lock.yaml"
      - "**/Cargo.lock"
      - "**/pnpm-lock.yaml"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "apps/ui/package.json"
      - "apps/ui/pnpm-lock.yaml"
      - "**/Cargo.lock"
      - "**/pnpm-lock.yaml"
      - ".github/**"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --version "^0.22" || cargo install cargo-audit --locked
          fi

      - name: Audit the Rust lockfile
        # Vulns that cannot be fixed yet must be listed in .cargo/audit.toml
        # with a link to the tracking issue rather than silenced in this file.
        run: cargo audit

  deny:
    name: Licenses and sources (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check all

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: No build output committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(target|node_modules|dist)/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Build output or dependencies are tracked by git:"
            echo "$bad"
            exit 1
          fi
      - name: No secret-looking files committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env(\.|$)|\.pem$|\.pfx$|\.key$|id_rsa' || true)
          if [ -n "$bad" ]; then
            echo "::error::Secret-like files are tracked by git:"
            echo "$bad"
            exit 1
          fi
      - name: No oversized files
        run: |
          set -euo pipefail
          bad=$(git ls-files -z | xargs -0 -I{} sh -c 'size=$(wc -c < "{}"); if [ "$size" -gt 1048576 ]; then echo "{} ($size bytes)"; fi' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files above 1 MiB (use Git LFS or external storage):"
            echo "$bad"
            exit 1
          fi
      - name: Workspace manifests parse
        run: |
          python3 - <<'PY'
          import tomllib, glob, sys
          files = ["Cargo.toml", *glob.glob("crates/*/Cargo.toml"), *glob.glob("apps/*/Cargo.toml")]
          for path in files:
              with open(path, "rb") as handle:
                  tomllib.load(handle)
          print(f"parsed {len(files)} Cargo manifests")
          PY
