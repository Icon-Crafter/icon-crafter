# Icon Crafter collaboration/publishing backend.
#
#   docker compose up -d postgres minio createbuckets server
#
# Optional cache profile (not used by the server yet, reserved for presence
# fan-out and caching):
#
#   docker compose --profile cache up -d
#
# Copy apps/backend/.env.example to .env before exposing this stack, and
# change POSTGRES_PASSWORD / MINIO_ROOT_PASSWORD / COOKIE_SECURE.

name: iconcrafter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iconcrafter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iconcrafter}
      POSTGRES_DB: ${POSTGRES_DB:-iconcrafter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iconcrafter} -d ${POSTGRES_DB:-iconcrafter}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iconcrafter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iconcrafter-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  createbuckets:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/${S3_BUCKET:-iconcrafter}
        mc anonymous set none local/${S3_BUCKET:-iconcrafter}
        echo "bucket ${S3_BUCKET:-iconcrafter} is ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iconcrafter}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iconcrafter-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-iconcrafter}

  redis:
    # Optional: the current server keeps presence and rate limiting in-process.
    # This service is provided for a future shared presence/cache tier.
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-iconcrafter}:${POSTGRES_PASSWORD:-iconcrafter}@postgres:5432/${POSTGRES_DB:-iconcrafter}
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ic_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      STORAGE_KIND: ${STORAGE_KIND:-s3}
      STORAGE_LOCAL_DIR: /app/data/storage
      S3_BUCKET: ${S3_BUCKET:-iconcrafter}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-iconcrafter}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-iconcrafter-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_PREFIX: ${S3_PREFIX:-iconcrafter/}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn,sqlx=warn}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Only used when STORAGE_KIND=local.
      - serverdata:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  miniodata:
  serverdata:
